name: test

# Run on every push to main, and on every pull request targeting main.
# PRs from contributors will be blocked from merging until all jobs pass.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------:
  # Job 1: Build the binary and run all tests on all three platforms.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # if Windows fails, keep Linux and macOS running
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # Clone the repo onto the CI machine.
      - uses: actions/checkout@v4

      # Cache the FetchContent downloads (FTXUI).
      # Key is a hash of CMakeLists.txt — cache busts automatically when
      # you change a dependency version.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-deps-

      # Configure. CMAKE_BUILD_TYPE is used by single-config generators
      # (Linux/macOS). On Windows, MSVC is a multi-config generator and
      # ignores this; --config Release at build time selects the config.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # Build. --config Release is ignored on single-config generators,
      # so this command works correctly on all three platforms.
      - name: Build
        run: cmake --build build --config Release

  # ---------------------------------------------------------------------------
  # Job 2: Thread Sanitizer.
  # Recompiles just the test targets with -fsanitize=thread and runs them.
  # Catches data races in the network flush/recv threading logic.
  # Linux only — TSAN is not available on Windows (MSVC has no equivalent)
  # and macOS support is less reliable on CI runners.
  # ---------------------------------------------------------------------------
  tsan:
    name: Thread Sanitizer (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure with TSAN
        run: |
          cmake -B build-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build test targets
        run: cmake --build build-tsan --target test_net test_record

      # TSAN only instruments the network / record tests (the threaded code
      # paths). Filter ctest so it does not try to run executables this job
      # never built.
      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure -R "net_tests|record_tests"


